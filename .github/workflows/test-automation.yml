name: Test Automation
on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
      with:
        lfs: true
    
    - name: Set up JDK 21
      uses: actions/setup-java@v3
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    
    # Install Chrome
    - name: Install Chrome
      run: |
        sudo mkdir -p /etc/apt/sources.list.d
        sudo mkdir -p /etc/apt/keyrings
        curl -fsSL https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo gpg --dearmor -o /etc/apt/keyrings/google-chrome.gpg
        echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/google-chrome.gpg] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
        sudo apt-get update
        sudo apt-get install google-chrome-stable -y
    
    # Setup ChromeDriver
    - name: Setup ChromeDriver
      uses: nanasess/setup-chromedriver@master
      
    # Start Chrome Driver
    - name: Start ChromeDriver
      run: |
        export DISPLAY=:99
        chromedriver --version
        google-chrome --version
        sudo Xvfb -ac :99 -screen 0 1920x1080x24 > /dev/null 2>&1 &
    
    # Debug Chrome Setup
    - name: Debug Chrome Setup
      run: |
        which google-chrome
        google-chrome --version
        which chromedriver
        chromedriver --version
    
    # Start API Application
    - name: Start API Application
      run: |
        cp demo-0.0.1-SNAPSHOT.jar API_Testing/
        cd API_Testing
        chmod +x demo-0.0.1-SNAPSHOT.jar || echo "chmod failed"
        java -jar demo-0.0.1-SNAPSHOT.jar &
        sleep 30
    
    # Run API Tests
    - name: Run API Tests
      working-directory: ./API_Testing
      run: mvn clean test -Dtest=com.qa.api.**
      continue-on-error: true
    
    # Run UI Tests
    - name: Run UI Tests
      working-directory: ./Functional_Testing
      run: mvn clean test -Dtest=com.qa.ui.**
      continue-on-error: true

    # Debug step to check results
    - name: Debug Test Results
      if: always()
      run: |
        echo "API Testing Results:"
        ls -la API_Testing/target/allure-results || echo "API results not found"
        echo "UI Testing Results:"
        ls -la Functional_Testing/target/allure-results || echo "UI results not found"

    # Generate API Report
    - name: Generate API Report
      uses: simple-elf/allure-report-action@master
      if: always()
      with:
        allure_results: API_Testing/target/allure-results
        gh_pages: gh-pages
        allure_report: allure-api-report
        allure_history: allure-api-history

    # Generate UI Report
    - name: Generate UI Report
      uses: simple-elf/allure-report-action@master
      if: always()
      with:
        allure_results: Functional_Testing/target/allure-results
        gh_pages: gh-pages
        allure_report: allure-ui-report
        allure_history: allure-ui-history

    # Prepare deployment directory
    - name: Prepare reports for deployment
      if: always()
      run: |
        mkdir -p gh-pages
        # Create main index.html
        cat > gh-pages/index.html << 'EOF'
        <!DOCTYPE html>
        <html>
        <head>
            <title>Test Reports</title>
            <style>
                body { font-family: Arial, sans-serif; padding: 20px; }
                .report-link {
                    display: inline-block;
                    padding: 10px 20px;
                    margin: 10px;
                    background-color: #0366d6;
                    color: white;
                    text-decoration: none;
                    border-radius: 5px;
                }
            </style>
        </head>
        <body>
            <h1>Test Reports</h1>
            <div>
                <a class="report-link" href="./api">API Test Report</a>
                <a class="report-link" href="./ui">UI Test Report</a>
            </div>
        </body>
        </html>
        EOF
        
        # Copy reports to deployment directory
        cp -r allure-api-history gh-pages/api
        cp -r allure-ui-history gh-pages/ui

    # Deploy to GitHub Pages
    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      if: always()
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_branch: gh-pages
        publish_dir: gh-pages
        force_orphan: true

    # Debug Deployment
    - name: Debug Deployment Directory
      if: always()
      run: |
        echo "Contents of gh-pages directory:"
        ls -la gh-pages/
        echo "Contents of API report directory:"
        ls -la gh-pages/api || echo "API directory not found"
        echo "Contents of UI report directory:"
        ls -la gh-pages/ui || echo "UI directory not found"