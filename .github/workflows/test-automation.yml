name: Test Automation
on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
      with:
        lfs: true
    
    - name: Set up JDK 21
      uses: actions/setup-java@v3
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    
    # Install Chrome
    - name: Install Chrome
      run: |
        sudo mkdir -p /etc/apt/sources.list.d
        sudo mkdir -p /etc/apt/keyrings
        curl -fsSL https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo gpg --dearmor -o /etc/apt/keyrings/google-chrome.gpg
        echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/google-chrome.gpg] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
        sudo apt-get update
        sudo apt-get install google-chrome-stable -y
    
    # Setup ChromeDriver
    - name: Setup ChromeDriver
      uses: nanasess/setup-chromedriver@master
      
    # Start Chrome Driver
    - name: Start ChromeDriver
      run: |
        export DISPLAY=:99
        chromedriver --version
        google-chrome --version
        sudo Xvfb -ac :99 -screen 0 1920x1080x24 > /dev/null 2>&1 &
    
    # Debug Chrome Setup
    - name: Debug Chrome Setup
      run: |
        which google-chrome
        google-chrome --version
        which chromedriver
        chromedriver --version
    
    # Start API Application
    - name: Start API Application
      run: |
        cp demo-0.0.1-SNAPSHOT.jar API_Testing/
        cd API_Testing
        chmod +x demo-0.0.1-SNAPSHOT.jar || echo "chmod failed"
        java -jar demo-0.0.1-SNAPSHOT.jar &
        sleep 30
    
    # Run API Tests
    - name: Run API Tests
      working-directory: ./API_Testing
      run: mvn clean test -Dtest=com.qa.**
      continue-on-error: true

    # Debug API Test Results
    - name: Debug API Results
      if: always()
      run: |
        echo "API Test Results Content:"
        ls -R API_Testing/target/allure-results/
        echo "Number of API result files:"
        find API_Testing/target/allure-results -type f | wc -l
    
    # Run UI Tests
    - name: Run UI Tests
      working-directory: ./Functional_Testing
      run: mvn clean test -Dtest=com.qa.**
      continue-on-error: true

    # Debug UI Test Results
    - name: Debug UI Results
      if: always()
      run: |
        echo "UI Test Results Content:"
        ls -R Functional_Testing/target/allure-results/
        echo "Number of UI result files:"
        find Functional_Testing/target/allure-results -type f | wc -l

    # Combine test results with verification
    - name: Combine Allure Results
      if: always()
      run: |
        mkdir -p allure-results
        cp -r API_Testing/target/allure-results/* allure-results/ || true
        cp -r Functional_Testing/target/allure-results/* allure-results/ || true
        echo "Combined Results Content:"
        ls -R allure-results/
        echo "Total number of result files:"
        find allure-results -type f | wc -l

    # Generate Allure Report
    - name: Generate Allure Report
      uses: simple-elf/allure-report-action@master
      if: always()
      with:
        allure_results: allure-results
        allure_report: allure-report
        allure_history: allure-history
        
    # Deploy Allure Report
    - name: Deploy Allure Report
      if: always()
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./allure-report
        publish_branch: gh-pages
        force_orphan: true
        
    - name: Cleanup
      if: always()
      run: |
        sudo chmod -R 777 API_Testing/target
        sudo chmod -R 777 Functional_Testing/target
        sudo chmod -R 777 allure-results
        sudo chmod -R 777 allure-report
        sudo chmod -R 777 allure-history
        rm -rf API_Testing/target
        rm -rf Functional_Testing/target
        rm -rf allure-results
        rm -rf allure-report
        rm -rf allure-history