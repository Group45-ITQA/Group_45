name: Test Automation
on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
      with:
        lfs: true
    
    - name: Set up JDK 21
      uses: actions/setup-java@v3
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    
    # Install Chrome
    - name: Install Chrome
      run: |
        sudo mkdir -p /etc/apt/sources.list.d
        sudo mkdir -p /etc/apt/keyrings
        curl -fsSL https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo gpg --dearmor -o /etc/apt/keyrings/google-chrome.gpg
        echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/google-chrome.gpg] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
        sudo apt-get update
        sudo apt-get install google-chrome-stable -y
    
    # Setup ChromeDriver
    - name: Setup ChromeDriver
      uses: nanasess/setup-chromedriver@master
      
    # Start Chrome Driver
    - name: Start ChromeDriver
      run: |
        export DISPLAY=:99
        chromedriver --version
        google-chrome --version
        sudo Xvfb -ac :99 -screen 0 1920x1080x24 > /dev/null 2>&1 &
    
    # Debug Chrome Setup
    - name: Debug Chrome Setup
      run: |
        which google-chrome
        google-chrome --version
        which chromedriver
        chromedriver --version
    
    # Start API Application
    - name: Start API Application
      run: |
        cp demo-0.0.1-SNAPSHOT.jar API_Testing/
        cd API_Testing
        chmod +x demo-0.0.1-SNAPSHOT.jar || echo "chmod failed"
        java -jar demo-0.0.1-SNAPSHOT.jar &
        sleep 30
    
     # Run API Tests
    - name: Run API Tests
      working-directory: ./API_Testing
      run: mvn clean test -Dtest=com.qa.api.**
      continue-on-error: true
    
    # Run UI Tests
    - name: Run UI Tests
      working-directory: ./Functional_Testing
      run: mvn clean test -Dtest=com.qa.ui.**
      continue-on-error: true

   # Generate Separate Allure Reports
    - name: Generate Allure API Report
      uses: simple-elf/allure-report-action@master
      if: always()
      with:
        allure_results: API_Testing/target/allure-results
        gh_pages: gh-pages
        allure_report: allure-report/api
        allure_history: allure-history/api
        keep_reports: 20
    
    - name: Generate Allure UI Report
      uses: simple-elf/allure-report-action@master
      if: always()
      with:
        allure_results: Functional_Testing/target/allure-results
        gh_pages: gh-pages
        allure_report: allure-report/ui
        allure_history: allure-history/ui
        keep_reports: 20

    # Deploy reports to Github Pages
    - name: Deploy API Report to Github Pages
      uses: peaceiris/actions-gh-pages@v3
      if: always()
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_branch: gh-pages
        publish_dir: allure-history/api
        force_orphan: false
        keep_files: true
    
    - name: Deploy UI Report to Github Pages
      uses: peaceiris/actions-gh-pages@v3
      if: always()
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_branch: gh-pages
        publish_dir: allure-history/ui
        force_orphan: false
        keep_files: true

    # Upload Artifacts (Optional but helpful for debugging)
    - name: Upload Allure API Report
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: allure-report-api
        path: allure-report/api/
        retention-days: 30
    
    - name: Upload Allure UI Report
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: allure-report-ui
        path: allure-report/ui/
        retention-days: 30