name: Test Automation

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0
    
    - name: Set up JDK 21
      uses: actions/setup-java@v3
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    
    - name: Cache Maven packages
      uses: actions/cache@v3
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2
    
    - name: Download UI Test Dependencies
      run: |
        cd Functional_Testing
        mvn dependency:go-offline
        
    - name: Download API Test Dependencies
      run: |
        cd API_Testing
        mvn dependency:go-offline
        
    - name: Start API Application
      run: |
        java -jar demo-0.0.1-SNAPSHOT.jar &
        sleep 30
      
    - name: Run UI Tests
      run: |
        cd Functional_Testing
        mvn clean test
        
    - name: Run API Tests
      run: |
        cd API_Testing
        mvn clean test
        
    - name: Stop API Application
      if: always()
      run: |
        pkill java || true
        
    - name: Get Allure history
      uses: actions/checkout@v3
      if: always()
      continue-on-error: true
      with:
        ref: gh-pages
        path: gh-pages
        
    - name: Generate Allure Report
      uses: simple-elf/allure-report-action@master
      if: always()
      id: allure-report
      with:
        allure_results: |
          Functional_Testing/target/allure-results
          API_Testing/target/allure-results
        gh_pages: gh-pages
        allure_report: allure-report
        allure_history: allure-history
        
    - name: Configure Pages
      uses: actions/configure-pages@v4
        
    - name: Upload Pages Artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: 'allure-history'
        
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4

    - name: Report URL
      run: |
        echo "::notice title=Allure Report::Report is available at https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
