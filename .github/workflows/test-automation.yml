name: Test Automation
on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
      with:
        lfs: true
    
    - name: Set up JDK 21
      uses: actions/setup-java@v3
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    
    # Install Chrome
    - name: Install Chrome
      run: |
        sudo mkdir -p /etc/apt/sources.list.d
        sudo mkdir -p /etc/apt/keyrings
        curl -fsSL https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo gpg --dearmor -o /etc/apt/keyrings/google-chrome.gpg
        echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/google-chrome.gpg] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
        sudo apt-get update
        sudo apt-get install google-chrome-stable -y
    
    # Setup ChromeDriver
    - name: Setup ChromeDriver
      uses: nanasess/setup-chromedriver@master
      
    # Start Chrome Driver
    - name: Start ChromeDriver
      run: |
        export DISPLAY=:99
        chromedriver --version
        google-chrome --version
        sudo Xvfb -ac :99 -screen 0 1920x1080x24 > /dev/null 2>&1 &
    
    # Debug Chrome Setup
    - name: Debug Chrome Setup
      run: |
        which google-chrome
        google-chrome --version
        which chromedriver
        chromedriver --version
    
    # Start API Application
    - name: Start API Application
      run: |
        cp demo-0.0.1-SNAPSHOT.jar API_Testing/
        cd API_Testing
        chmod +x demo-0.0.1-SNAPSHOT.jar || echo "chmod failed"
        java -jar demo-0.0.1-SNAPSHOT.jar &
        sleep 30
    
     # Run API Tests
    - name: Run API Tests
      working-directory: ./API_Testing
      run: mvn clean test -Dtest=com.qa.api.**
      continue-on-error: true
    
    # Run UI Tests
    - name: Run UI Tests
      working-directory: ./Functional_Testing
      run: mvn clean test -Dtest=com.qa.ui.**
      continue-on-error: true

    # Create directories for combined reports
    - name: Prepare Report Directories
      if: always()
      run: |
        mkdir -p combined-reports/api
        mkdir -p combined-reports/ui
        cp -r API_Testing/target/allure-results/* combined-reports/api/ || true
        cp -r Functional_Testing/target/allure-results/* combined-reports/ui/ || true

    # Generate report for API tests
    - name: Generate API Report
      uses: simple-elf/allure-report-action@master
      if: always()
      with:
        allure_results: combined-reports/api
        gh_pages: gh-pages
        allure_report: allure-report/api
        allure_history: allure-history/api

    # Generate report for UI tests
    - name: Generate UI Report
      uses: simple-elf/allure-report-action@master
      if: always()
      with:
        allure_results: combined-reports/ui
        gh_pages: gh-pages
        allure_report: allure-report/ui
        allure_history: allure-history/ui

    # Create index.html for GitHub Pages
    - name: Create index page
      if: always()
      run: |
        mkdir -p published-reports
        cat > published-reports/index.html << 'EOF'
        <!DOCTYPE html>
        <html>
        <head>
            <title>Test Reports</title>
            <style>
                body { font-family: Arial, sans-serif; margin: 40px; }
                .button {
                    display: inline-block;
                    padding: 10px 20px;
                    margin: 10px;
                    background-color: #007bff;
                    color: white;
                    text-decoration: none;
                    border-radius: 5px;
                }
            </style>
        </head>
        <body>
            <h1>Test Reports</h1>
            <a class="button" href="./api/">API Test Report</a>
            <a class="button" href="./ui/">UI Test Report</a>
        </body>
        </html>
        EOF

    # Move reports to publishing directory
    - name: Prepare reports for publishing
      if: always()
      run: |
        cp -r allure-history/api published-reports/api
        cp -r allure-history/ui published-reports/ui

    # Deploy to GitHub Pages
    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      if: always()
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_branch: gh-pages
        publish_dir: published-reports
        force_orphan: true

    # Upload artifacts for debugging
    - name: Upload Raw Results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: allure-raw-results
        path: combined-reports/
        retention-days: 7