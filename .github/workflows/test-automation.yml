name: Test Automation

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest  # Changed to Ubuntu
    
    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0  # Fetch all history for proper Git operations
    
    - name: Set up JDK 21
      uses: actions/setup-java@v3
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    
    - name: Cache Maven packages
      uses: actions/cache@v3
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2
    
    - name: Download UI Test Dependencies
      run: |
        cd Functional_Testing
        mvn dependency:go-offline
        
    - name: Download API Test Dependencies
      run: |
        cd API_Testing
        mvn dependency:go-offline
        
    # Start the API application
    - name: Start API Application
      run: |
        java -jar demo-0.0.1-SNAPSHOT.jar &
        sleep 30  # Wait for application to start
      
    # Run UI Tests
    - name: Run UI Tests
      run: |
        cd Functional_Testing
        mvn clean test
        
    # Run API Tests
    - name: Run API Tests
      run: |
        cd API_Testing
        mvn clean test
        
    # Stop the API application
    - name: Stop API Application
      if: always()
      run: |
        pkill java || true
        
    - name: Generate Allure Report
      uses: simple-elf/allure-report-action@master
      if: always()
      id: allure-report
      with:
        allure_results: |
          Functional_Testing/target/allure-results
          API_Testing/target/allure-results
        allure_report: allure-report
        
    - name: Upload Artifact
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: allure-report
        path: allure-report/
        retention-days: 30
