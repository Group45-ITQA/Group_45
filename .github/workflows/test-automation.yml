name: Test Automation
on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up JDK 21
      uses: actions/setup-java@v3
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    
    # Debug step to check file location and permissions
    - name: Debug JAR location
      run: |
        echo "Current directory:"
        pwd
        echo "Files in current directory:"
        ls -la
        echo "Checking JAR file:"
        ls -la demo-0.0.1-SNAPSHOT.jar || echo "JAR not found"
    
    # Start API Application with explicit permissions
    - name: Start API Application
      run: |
        chmod +x demo-0.0.1-SNAPSHOT.jar || echo "chmod failed"
        java -jar demo-0.0.1-SNAPSHOT.jar &
        sleep 30
    
    # Run API Tests from API_Testing directory
    - name: Run API Tests
      working-directory: ./API_Testing
      run: mvn clean test
        
    # Run UI Tests from Functional_Testing directory
    - name: Run UI Tests
      working-directory: ./Functional_Testing
      run: mvn clean test
    
    # Stop API application
    - name: Stop API Application
      if: always()
      run: |
        pkill java || true
        
    # Generate Allure Report
    - name: Generate Allure Report
      if: always()
      uses: simple-elf/allure-report-action@master
      with:
        allure_results: |
          Functional_Testing/target/allure-results
          API_Testing/target/allure-results
        gh_pages: gh-pages
        allure_report: allure-report
        allure_history: allure-history
        
    # Deploy to GitHub Pages
    - name: Deploy to GitHub Pages
      if: always()
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_branch: gh-pages
        publish_dir: allure-history
        force_orphan: true
