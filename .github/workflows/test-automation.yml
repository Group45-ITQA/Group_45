name: Test Automation
on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
      with:
        lfs: true
    
    - name: Set up JDK 21
      uses: actions/setup-java@v3
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    
    # Install Chrome
    - name: Install Chrome
      run: |
        wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
        sudo sh -c 'echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" >> /etc/sources.list.d/google.list'
        sudo apt-get update
        sudo apt-get install google-chrome-stable -y
    
    # Setup ChromeDriver
    - name: Setup ChromeDriver
      uses: nanasess/setup-chromedriver@master
      
    # Start Chrome Driver
    - name: Start ChromeDriver
      run: |
        export DISPLAY=:99
        chromedriver --version
        google-chrome --version
        sudo Xvfb -ac :99 -screen 0 1920x1080x24 > /dev/null 2>&1 &
    
    # Debug Chrome installation
    - name: Debug Chrome Setup
      run: |
        which google-chrome
        google-chrome --version
        which chromedriver
        chromedriver --version
    
    # Start API Application
    - name: Start API Application
      run: |
        cp demo-0.0.1-SNAPSHOT.jar API_Testing/
        cd API_Testing
        chmod +x demo-0.0.1-SNAPSHOT.jar || echo "chmod failed"
        java -jar demo-0.0.1-SNAPSHOT.jar &
        sleep 30
    
    # Run API Tests
    - name: Run API Tests
      working-directory: ./API_Testing
      run: mvn clean test
    
    # Run UI Tests with debug output
    - name: Run UI Tests
      working-directory: ./Functional_Testing
      run: mvn clean test -X
    
    # Rest of your workflow remains the same...
